<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RK TT Wedding Photobooth</title>

  <link rel="icon" href="Assets/favicon.png" type="image/png">
  <link rel="stylesheet" href="StyleSheets/style.css">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&family=Pixelify+Sans:wght@400..700&display=swap" rel="stylesheet">


</head>
<body>
    <div>
      <h2>Kanisa & Nakarin <br/> Wedding!</h2>
    </div>

    <div class="photobooth-container" id="booth">
      <div class="frame-container"></div>
      <div class="countdown-timer">3</div>
      <canvas id="finalCanvas" width="1176" height="1470"></canvas>
      <video id="liveVideo" autoplay playsinline muted></video>   
      <img class="frame-overlay" src="Assets/frame.png" alt="frame overlay">
    </div>

    <div class="controls">
      <button id="takePhoto">Take Photo</button>
      <button id="readyButton" disabled style="display:none;" >Ready</button>
    </div>

    <script src="Javascripts/camera.js" defer></script>    

</body>
</html>
